name: palm-ledger-dev
services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run npm run local:setup}
      LOCAL_AUTH_PASSWORD: ${LOCAL_AUTH_PASSWORD}
      LOCAL_REST_PASSWORD: ${LOCAL_REST_PASSWORD}
    ports: ["127.0.0.1:${LOCAL_DB_PORT:-54322}:5432"]
    volumes:
      - palm-db:/var/lib/postgresql/data
      - ./scripts/local-db-init.sh:/docker-entrypoint-initdb.d/01-supabase-auth.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  auth:
    image: ghcr.io/supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${LOCAL_AUTH_PASSWORD}@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: ${APP_URL}
      API_EXTERNAL_URL: ${SUPABASE_URL}
      GOTRUE_JWT_SECRET: ${LOCAL_JWT_SECRET}
      GOTRUE_JWT_EXP: ${LOCAL_JWT_EXP:-3600}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
  rest:
    image: ghcr.io/supabase/postgrest:v16.4@sha256:d155c6718ed9a9f990d159a2ab7c0a3f16944dbb6d0a0344557421042acfe0df
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${LOCAL_REST_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${LOCAL_JWT_SECRET}
  gateway:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    depends_on: [auth, rest]
    ports: ["127.0.0.1:${LOCAL_API_PORT:-54321}:80"]
    volumes: ["./scripts/local-gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
volumes:
  palm-db:
