server {
  listen 80;
  location /auth/v1/ { proxy_pass http://auth:9999/; }
  location /rest/v1/ { proxy_pass http://rest:3000/; }
  location /storage/v1/ {
    # Allow the 10 MiB originals plus multipart headers in the isolated stack.
    client_max_body_size 12m;
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "apikey, authorization, content-type, x-upsert, x-client-info" always;
      add_header Access-Control-Max-Age 86400 always;
      return 204;
    }
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Vary Origin always;
    proxy_pass http://storage:5000/;
  }
}
