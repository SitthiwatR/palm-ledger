function defaultGarden(){return page==='garden'&&selectedGarden?selectedGarden:state.gardens[0].id;}
function saveRecords(records,oldId=null){const next={...state,records:[...state.records.filter(r=>r.id!==oldId),...records]};persist(next);closeModal();render();toast(oldId?'แก้ไขแล้ว':'บันทึกแล้ว');}
function photoField(){return `<div><label class="photo-upload">${ico('camera')}<span>ถ่ายรูปหรือเลือกรูปบิล</span><input type="file" name="photo" accept="image/jpeg,image/png,image/webp" aria-label="เลือกรูปบิล"></label><p class="form-hint">JPG, PNG หรือ WebP ไม่เกิน 2 MB · หากเป็น HEIC ให้แปลงเป็น JPG ก่อน</p><div id="photo-preview"></div></div>`;}
function bindPhoto(form,existing=''){
 let photo=existing;
 const preview=$('#photo-preview',form);
 const show=()=>{preview.innerHTML=photo?`<img class="receipt-preview" src="${esc(photo)}" alt="รูปบิลที่แนบ"><button type="button" class="text-button" id="remove-photo">นำรูปออก</button>`:'';$('#remove-photo',form)?.addEventListener('click',()=>{photo='';form.elements.namedItem('photo').value='';show();});};show();
 let pending=Promise.resolve();
 form.elements.namedItem('photo').addEventListener('change',()=>{const file=form.elements.namedItem('photo').files[0];if(!file)return;
 pending=(async()=>{if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>2000000)throw new Error('เลือกรูป JPG, PNG หรือ WebP ขนาดไม่เกิน 2 MB');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('อ่านรูปไม่สำเร็จ'));reader.readAsDataURL(file);});photo=data;show();})();pending.catch(e=>{form.elements.namedItem('photo').value='';error(form,e.message);pending=Promise.resolve();});
 });
 return async()=>{await pending;return photo;};
}
function saleForm(existing=null){

 let getPhoto;
 const f=bindForm(async f=>{
  const amount=quantityTotal(val(f,'weight'),val(f,'rate'))-minor(val(f,'deduction'));
  if(amount<=0)throw new Error('ยอดรับสุทธิต้องมากกว่า 0');
  const sale=recordCheck({id:r?.id||id(),kind:'income',garden:val(f,'garden'),date:val(f,'date'),title:'ขายปาล์ม',category:'sale',party:val(f,'party').trim(),amount,paid:amount,note:val(f,'note').trim(),photo:await getPhoto(),payments:[],details:{weight:val(f,'weight'),rate:val(f,'rate'),deduction:val(f,'deduction'),receiptNo:val(f,'receiptNo').trim()}},state.gardens);
  const duplicate=state.records.find(x=>x.id!==r?.id&&x.kind==='income'&&x.date===sale.date&&x.garden===sale.garden&&x.amount===sale.amount&&x.party===sale.party);
  if(duplicate&&!confirm('มีบิลวันที่ สวน ผู้รับซื้อ และยอดเงินเดียวกันอยู่แล้ว ต้องการบันทึกอีกครั้งหรือไม่?'))return;
  const records=[sale];
  if(f.elements.namedItem('addWage')?.checked){if(!val(f,'team').trim())throw new Error('กรอกชื่อทีมเก็บเกี่ยว');const amount=quantityTotal(val(f,'weight'),val(f,'wageRate'),1000);records.push(recordCheck({id:id(),kind:'expense',garden:sale.garden,date:sale.date,title:'ค่าแรงทีม '+val(f,'team').trim(),category:'production',party:val(f,'team').trim(),amount,paid:0,note:'จากบิลขาย '+(sale.details.receiptNo||fmtDate(sale.date)),payments:[],saleId:sale.id,details:{quantity:val(f,'weight'),rate:val(f,'wageRate')}},state.gardens));}
  saveRecords(records,r?.id);
 });

 const calc=()=>{try{$('#sale-total').textContent=baht(quantityTotal(val(f,'weight'),val(f,'rate'))-minor(val(f,'deduction')));}catch{$('#sale-total').textContent='฿0';}if(!r){$('#wage-fields').hidden=!f.elements.namedItem('addWage').checked;try{$('#wage-preview').textContent='ค่าแรงค้างจ่าย '+baht(quantityTotal(val(f,'weight'),val(f,'wageRate'),1000));}catch{$('#wage-preview').textContent='คำนวณจากน้ำหนัก ÷ 1,000 × อัตราต่อตัน';}}};f.addEventListener('input',calc);calc();
}
function expenseForm(existing=null,opening=false){
 const r=existing,d=r?.details||{},isOpening=opening||r?.opening;
 openModal(isOpening?'หนี้ค้างเดิม':r?'แก้ไขรายจ่าย':'เพิ่มรายจ่าย',`<form><label>สวน<select name="garden">${gardenOptions(r?.garden||defaultGarden(),!isOpening)}</select></label>${dateField(r?.date)}${isOpening?'<p class="note">หนี้ก่อนวันเริ่มใช้ระบบ จะแสดงเป็นยอดค้างจ่าย โดยไม่หักยอดสุทธิยกมาซ้ำ</p>':''}<label>ประเภท<select name="category">${Object.entries(categories).filter(([k])=>k!=='sale').map(([k,v])=>`<option value="${k}" ${k===(r?.category||'other')?'selected':''}>${v}</option>`).join('')}</select></label><label id="party-label"><span>ผู้รับเงิน / ร้านค้า</span><input name="party" value="${esc(r?.party)}" placeholder="ชื่อคน ทีม หรือร้านค้า"></label><div id="quantity-fields" class="two-col" hidden><label><span id="quantity-label">จำนวน</span><input name="quantity" type="number" min="0.001" step="0.001" inputmode="decimal" value="${esc(d.quantity)}"></label><label><span id="rate-label">อัตรา (บาท)</span><input name="rate" type="number" min="0.01" step="0.01" inputmode="decimal" value="${esc(d.rate)}"></label></div><p id="quantity-hint" class="form-hint" hidden></p><label id="title-field">ชื่อรายการ<input name="title" required value="${esc(r?.title)}" placeholder="เช่น ซ่อมเครื่องตัดหญ้า"></label><label>ยอดเต็ม (บาท)<input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" value="${r?amountValue(r.amount):''}" required></label>${isOpening?'':`<label>การจ่ายเงิน<select name="paymentState"><option value="full" ${r&&r.paid<r.amount?'':'selected'}>จ่ายครบแล้ว</option><option value="none" ${r&&r.paid===0?'selected':''}>ยังไม่จ่าย</option><option value="partial" ${r&&r.paid>0&&r.paid<r.amount?'selected':''}>จ่ายบางส่วน</option></select></label><label id="paid-field" hidden>จ่ายแล้วรวม (บาท)<input name="paid" type="number" min="0" step="0.01" inputmode="decimal" value="${r?amountValue(r.paid):''}"></label>`}<div class="calculation"><span>${isOpening?'ยอดค้างเดิม':'ยอดค้างจ่าย'}</span><strong id="expense-pending">฿0</strong></div>${!isOpening?photoField():''}<label>หมายเหตุ<textarea name="note">${esc(r?.note)}</textarea></label>${endForm()}</form>`);
 let getPhoto=async()=>r?.photo||'';
 const f=bindForm(async f=>{
  const category=val(f,'category');let amount=minor(val(f,'amount'));const calculated=['daily','production','fertilizer'].includes(category)&&!isOpening;
  const details=calculated?{quantity:val(f,'quantity'),rate:val(f,'rate')}:{};
  if(calculated){amount=quantityTotal(details.quantity,details.rate,category==='production'?1000:1);if(category==='daily'&&Number(details.quantity)*2%1!==0)throw new Error('จำนวนวันต้องเป็นวันเต็มหรือครึ่งวัน เช่น 1 หรือ 0.5');if(category==='fertilizer'&&val(f,'garden')==='shared')throw new Error('ค่าปุ๋ยต้องเลือกสวนที่ใช้จริง');if(!val(f,'party').trim()&&['daily','production'].includes(category))throw new Error('กรอกชื่อคนงานหรือทีม');}
  const mode=val(f,'paymentState'),paid=isOpening?0:mode==='full'?amount:mode==='none'?0:minor(val(f,'paid'));

  if(r&&record.paid!==r.paid&&r.payments?.length){throw new Error('รายการนี้มีประวัติจ่ายแล้ว กรุณาคงยอดจ่ายเดิม และเพิ่มการจ่ายผ่านหน้ารายละเอียด');}
  saveRecords([record],r?.id);
 });
 if(!isOpening)getPhoto=bindPhoto(f,r?.photo);
 let previousCategory='';
 const recalc=()=>{

  for(const name of ['quantity','rate'])f.elements.namedItem(name).required=calculated;
  f.elements.namedItem('amount').readOnly=calculated;
  const config={daily:['จำนวนวัน','ค่าแรง / วัน (บาท)','รองรับครึ่งวัน เช่น 0.5 หรือ 1.5 วัน','ชื่อคนงาน'],production:['น้ำหนัก (กก.)','ค่าแรง / ตัน (บาท)','น้ำหนัก ÷ 1,000 × อัตราต่อตัน เป็นค่าจ้างรวมของทีม','ชื่อทีม'],fertilizer:['กระสอบที่ใช้','ราคา / กระสอบ (บาท)','ลงเฉพาะปุ๋ยที่ใช้จริงในสวนนี้ ไม่มีการบันทึกสต็อก','ผู้รับเงิน / ร้านค้า']};
  if(calculated){const [q,rate,hint,party]=config[category];$('#quantity-label').textContent=q;$('#rate-label').textContent=rate;$('#quantity-hint').textContent=hint;$('#party-label span').textContent=party;f.elements.namedItem('quantity').step=category==='daily'?'0.5':'0.001';if(category!==previousCategory&&category==='production'&&!val(f,'rate'))f.elements.namedItem('rate').value='1000';try{f.elements.namedItem('amount').value=amountValue(quantityTotal(val(f,'quantity'),val(f,'rate'),category==='production'?1000:1));}catch{f.elements.namedItem('amount').value='';}}

 };
 f.addEventListener('input',recalc);recalc();
}
function detail(key){
 const r=state.records.find(r=>r.id===key);if(!r)return;
 const pending=r.kind==='expense'?r.amount-r.paid:0;
 openModal(r.title,`<div class="detail-total ${r.kind==='expense'?'negative':''}">${r.kind==='expense'?'−':''}${baht(r.amount)}</div><div class="detail-line"><span>สวน</span><b>${esc(gardenName(r.garden))}</b></div><div class="detail-line"><span>วันที่</span><b>${esc(fmtDate(r.date))}</b></div><div class="detail-line"><span>ประเภท</span><b>${r.opening?'หนี้ค้างเดิม · ':''}${esc(categories[r.category]||r.category)}</b></div>${r.party?`<div class="detail-line"><span>${r.kind==='income'?'ผู้รับซื้อ':'ผู้รับเงิน'}</span><b>${esc(r.party)}</b></div>`:''}${r.details?.receiptNo?`<div class="detail-line"><span>เลขที่บิล</span><b>${esc(r.details.receiptNo)}</b></div>`:''}${r.details?.weight?`<div class="detail-line"><span>น้ำหนัก × ราคา</span><b>${esc(r.details.weight)} กก. × ${esc(r.details.rate)} บาท</b></div>`:''}${r.details?.quantity?`<div class="detail-line"><span>จำนวน × อัตรา</span><b>${esc(r.details.quantity)} ${r.category==='daily'?'วัน':r.category==='fertilizer'?'กระสอบ':'กก.'} × ${esc(r.details.rate)} ${r.category==='production'?'บาท/ตัน':'บาท'}</b></div>`:''}${r.kind==='expense'?`<div class="detail-line"><span>จ่ายแล้ว</span><b>${baht(r.paid)}</b></div><div class="detail-line"><span>ค้างจ่าย</span><b>${baht(pending)}</b></div>`:'<p class="note">ได้รับเงินเต็มจำนวนแล้ว</p>'}${r.note?`<p class="note" style="white-space:pre-wrap">${esc(r.note)}</p>`:''}${r.photo?`<img class="receipt-preview" src="${esc(r.photo)}" alt="รูปบิลต้นฉบับ">`:''}${r.payments?.length?`<h3 style="margin-top:18px">ประวัติการจ่ายเพิ่มเติม</h3><ul class="payments">${r.payments.map(p=>`<li>${esc(fmtDate(p.date))} · ${baht(p.amount)}</li>`).join('')}</ul>`:''}${pending?`<button class="primary" data-action="pay" data-id="${esc(r.id)}" style="width:100%;margin-top:20px">บันทึกการจ่าย</button>`:''}<div class="tools"><button class="secondary small" data-action="edit-record" data-id="${esc(r.id)}">${ico('pencil-simple')}แก้ไข</button>${r.garden==='shared'&&!r.opening?`<button class="secondary small" data-action="allocate" data-id="${esc(r.id)}">แบ่งเข้าสวน</button>`:''}<button class="danger-button small" data-action="delete-record" data-id="${esc(r.id)}">${ico('trash')}ลบ</button></div>`);
}
function paymentForm(key){const r=state.records.find(r=>r.id===key);if(!r)return;openModal('บันทึกการจ่าย',`<form><p>${esc(r.title)} · ${esc(gardenName(r.garden))}</p><div class="calculation"><span>ค้างจ่าย</span><strong>${baht(r.amount-r.paid)}</strong></div>${dateField()}<label>จ่ายครั้งนี้ (บาท)<input name="amount" type="number" min="0.01" max="${amountValue(r.amount-r.paid)}" step="0.01" value="${amountValue(r.amount-r.paid)}" required></label><p class="form-hint">ลดเฉพาะยอดค้าง ไม่เพิ่มรายจ่ายซ้ำ</p>${endForm('ยืนยันการจ่าย')}</form>`);bindForm(f=>{const next=addPayment(r,minor(val(f,'amount')),val(f,'date'));persist({...state,records:state.records.map(x=>x.id===key?next:x)});render();detail(key);toast('บันทึกการจ่ายแล้ว');});}
function allocationForm(key){const r=state.records.find(r=>r.id===key);if(!r)return;openModal('แบ่งค่าใช้จ่ายเข้าสวน',`<form><p>${esc(r.title)}</p><div class="calculation"><span>ยอดที่ต้องแบ่ง</span><strong>${baht(r.amount)}</strong></div>${state.gardens.map((g,i)=>`<label>${esc(g.name)} (บาท)<input type="number" min="0" step="0.01" name="allocation-${i}" value="0" required></label>`).join('')}<p class="form-hint">แบ่งยอดเต็มให้ครบ ยอดจ่ายแล้วและยอดค้างจะกระจายตามสัดส่วน การแบ่งไม่เพิ่มรายจ่ายรวม</p>${endForm('ยืนยันแบ่งเข้าสวน')}</form>`);bindForm(f=>{const next=allocateRecord(state,key,state.gardens.map((g,i)=>({garden:g.id,amount:minor(val(f,'allocation-'+i))})));persist(next);closeModal();render();toast('แบ่งค่าใช้จ่ายแล้ว');});}
function gardenForm(key=null){const g=state.gardens.find(g=>g.id===key);openModal(g?'แก้ไขสวน':'เพิ่มสวน',`<form><label>ชื่อสวน<input name="name" value="${esc(g?.name)}" required maxlength="80" placeholder="เช่น สวนบ้าน"></label><label>ยอดสุทธิยกมา (บาท)<input name="opening" type="number" step="0.01" value="${g?amountValue(g.opening):'0'}" required></label><p class="form-hint">ยอดสุทธิก่อนเริ่มลงรายการ ติดลบได้ เช่น −5,000 บาท โดยไม่ต้องลงประวัติย้อนหลังทั้งหมด</p>${endForm(g?'บันทึกสวน':'เพิ่มสวน')}</form>`);bindForm(f=>{const name=val(f,'name').trim();if(!name)throw new Error('กรอกชื่อสวน');if(state.gardens.some(x=>x.id!==key&&x.name===name))throw new Error('มีชื่อสวนนี้แล้ว');const raw=val(f,'opening'),opening=raw.startsWith('-')?-minor(raw.slice(1)):minor(raw);const item={id:g?.id||id(),name,opening};persist({...state,gardens:g?state.gardens.map(x=>x.id===key?item:x):[...state.gardens,item]});closeModal();render();toast('บันทึกสวนแล้ว');});}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function exportJSON(){download('สวนปาล์ม-'+today()+'.json',JSON.stringify(state,null,2),'application/json');toast('ส่งออกไฟล์สำรองแล้ว');}
function csv(){const cell=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const rows=[['วันที่','สวน','ประเภท','รายการ','ยอดเต็ม','จ่ายแล้ว','ค้างจ่าย','ผู้รับเงิน/ผู้รับซื้อ','หมายเหตุ'],...state.records.filter(r=>(!filters.garden||r.garden===filters.garden)&&(!filters.kind||(filters.kind==='pending'?r.kind==='expense'&&r.paid<r.amount:r.kind===filters.kind))&&(!filters.from||r.date>=filters.from)&&(!filters.to||r.date<=filters.to)).map(r=>[r.date,gardenName(r.garden),r.opening?'หนี้ยกมา':categories[r.category],r.title,amountValue(r.amount),amountValue(r.paid),r.kind==='expense'?amountValue(r.amount-r.paid):'0',r.party,r.note])];download('รายการสวนปาล์ม-'+today()+'.csv','\uFEFF'+rows.map(row=>row.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function importJSON(){openModal('นำเข้าข้อมูลสำรอง',`<form><p class="note warning">การนำเข้าจะแทนที่ข้อมูลทั้งหมดในเครื่องนี้ ควรสำรองข้อมูลปัจจุบันไว้ก่อน</p><label>เลือกไฟล์ JSON<input name="backup" type="file" accept=".json,application/json" required></label><label class="check"><input type="checkbox" required>ยืนยันแทนที่ข้อมูลปัจจุบัน</label>${endForm('นำเข้าข้อมูล')}</form>`);bindForm(async f=>{const file=f.elements.namedItem('backup').files[0];if(!file||file.size>15000000)throw new Error('เลือกไฟล์ JSON ขนาดไม่เกิน 15 MB');const imported=validateState(JSON.parse(await file.text()));const previous=storageBlocked;storageBlocked=false;try{persist(imported);}catch(e){storageBlocked=previous;throw e;}notice='';closeModal();render();toast('นำเข้าข้อมูลแล้ว');});}
function startReal(){openModal('เริ่มข้อมูลจริง',`<form><p class="note warning">ล้างรายการและสวนปัจจุบันทั้งหมด แล้วเริ่มสวนแรกของคุณ กรุณาสำรองข้อมูลก่อนหากมีรายการที่ต้องเก็บ</p><button type="button" class="secondary small" data-action="export">สำรองข้อมูลก่อน</button><label>ชื่อสวนแรก<input name="name" placeholder="ชื่อสวน" required maxlength="80"></label><label>ยอดสุทธิยกมา (บาท)<input name="opening" type="number" step="0.01" value="0" required></label><label class="check"><input type="checkbox" required>ยืนยันเริ่มใหม่และแทนที่ข้อมูลเดิม</label>${endForm('เริ่มใช้งานจริง')}</form>`);bindForm(f=>{const name=val(f,'name').trim();if(!name)throw new Error('กรอกชื่อสวน');const raw=val(f,'opening'),opening=raw.startsWith('-')?-minor(raw.slice(1)):minor(raw);const previous=storageBlocked;storageBlocked=false;try{persist({version:1,demo:false,gardens:[{id:id(),name,opening}],records:[]});}catch(e){storageBlocked=previous;throw e;}notice='';page='home';selectedGarden=null;filters={garden:'',kind:'',from:'',to:''};closeModal();render();toast('พร้อมบันทึกข้อมูลจริงแล้ว');});}
document.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(!button)return;const action=button.dataset.action,key=button.dataset.id;
 try{switch(action){
 case 'navigate':page=button.dataset.page;render();window.scrollTo(0,0);break;
 case 'garden':selectedGarden=key;page='garden';render();window.scrollTo(0,0);break;
 case 'pending':filters={garden:'',kind:'pending',from:'',to:''};page='records';render();window.scrollTo(0,0);break;
 case 'sale':saleForm();break;
 case 'expense':expenseForm();break;
 case 'detail':detail(key);break;
 case 'pay':paymentForm(key);break;
 case 'allocate':allocationForm(key);break;
 case 'add-garden':gardenForm();break;
 case 'edit-garden':gardenForm(key);break;
 case 'edit-record':{const r=state.records.find(r=>r.id===key);if(r)r.kind==='income'?saleForm(r):expenseForm(r);break;}
 case 'delete-record':{const r=state.records.find(r=>r.id===key);if(r&&confirm('ลบรายการ “'+r.title+'” และประวัติการจ่ายของรายการนี้?'+(r.kind==='income'&&state.records.some(x=>x.saleId===r.id)?' ค่าแรงที่สร้างจากบิลนี้จะยังอยู่ กรุณาตรวจสอบแยกต่างหาก':''))){persist({...state,records:state.records.filter(r=>r.id!==key)});closeModal();render();toast('ลบรายการแล้ว');}break;}
 case 'opening-debt':expenseForm(null,true);break;
 case 'export':exportJSON();break;
 case 'import':importJSON();break;
 case 'csv':csv();break;
 case 'start-real':startReal();break;
 case 'clear-filters':filters={garden:'',kind:'',from:'',to:''};render();break;
 case 'add-menu':openModal('เพิ่มรายการ',`<div class="actions"><button class="primary" data-action="sale">${ico('camera')}บันทึกขายปาล์ม</button><button class="secondary" data-action="expense">${ico('receipt')}เพิ่มรายจ่าย</button></div>`);break;
 }}catch(e){toast(e.message||'ทำรายการไม่สำเร็จ');}
});
document.addEventListener('change',e=>{if(e.target.dataset.filter){filters[e.target.dataset.filter]=e.target.value;render();}});
window.addEventListener('storage',e=>{if(e.key===KEY){notice='ข้อมูลถูกเปลี่ยนจากอีกแท็บ กรุณาปิดแบบฟอร์มแล้วโหลดหน้าใหม่เพื่อใช้ข้อมูลล่าสุด';storageBlocked=true;render();}});
render();
})();
</script>
